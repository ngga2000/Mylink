<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      color: #777;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .card span {
      color: #777;
      font-size: 14px;
    }

    .card h2 {
      margin-top: 8px;
      font-size: 21px;
    }

    .balance {
      border-left: 5px solid #333;
    }

    .income {
      border-left: 5px solid #16a34a;
    }

    .expense {
      border-left: 5px solid #dc2626;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .panel h3 {
      margin-bottom: 15px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .85;
    }

    .filter {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
      gap: 10px;
    }

    .transaction:last-child {
      border-bottom: none;
    }

    .transaction-info {
      flex: 1;
    }

    .transaction-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .transaction-info small {
      color: #888;
    }

    .transaction-amount {
      font-weight: bold;
      white-space: nowrap;
    }

    .income-text {
      color: #16a34a;
    }

    .expense-text {
      color: #dc2626;
    }

    .delete-btn {
      width: auto;
      padding: 8px 10px;
      background: #dc2626;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 25px 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .clear-btn {
      background: #dc2626;
    }

    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .filter {
        grid-template-columns: 1fr;
      }

      .transaction {
        align-items: flex-start;
      }

      .transaction-amount {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>💰 Money Tracker</h1>
    <p>Catat dan kelola keuanganmu dengan mudah.</p>
  </header>

  <!-- RINGKASAN -->
  <div class="cards">

    <div class="card balance">
      <span>Saldo</span>
      <h2 id="balance">Rp0</h2>
    </div>

    <div class="card income">
      <span>Total Pemasukan</span>
      <h2 id="income">Rp0</h2>
    </div>

    <div class="card expense">
      <span>Total Pengeluaran</span>
      <h2 id="expense">Rp0</h2>
    </div>

  </div>

  <!-- FORM -->
  <div class="panel">

    <h3>➕ Tambah Transaksi</h3>

    <form id="transactionForm">

      <input
        type="text"
        id="description"
        placeholder="Contoh: Gaji, makan, bensin..."
        required
      >

      <input
        type="number"
        id="amount"
        placeholder="Nominal"
        min="1"
        required
      >

      <select id="type">
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>

      <select id="category">
        <option value="Gaji">Gaji</option>
        <option value="Makanan">Makanan</option>
        <option value="Transportasi">Transportasi</option>
        <option value="Belanja">Belanja</option>
        <option value="Tagihan">Tagihan</option>
        <option value="Hiburan">Hiburan</option>
        <option value="Lainnya">Lainnya</option>
      </select>

      <input
        type="date"
        id="date"
        required
      >

      <button type="submit">
        Simpan Transaksi
      </button>

    </form>

  </div>

  <!-- RIWAYAT -->
  <div class="panel">

    <h3>📋 Riwayat Transaksi</h3>

    <div class="filter">

      <select id="filterType">
        <option value="all">Semua Transaksi</option>
        <option value="income">Pemasukan</option>
        <option value="expense">Pengeluaran</option>
      </select>

      <input
        type="text"
        id="search"
        placeholder="Cari transaksi..."
      >

    </div>

    <div id="transactionList"></div>

    <div class="actions">
      <button class="clear-btn" onclick="clearAll()">
        🗑️ Hapus Semua Data
      </button>
    </div>

  </div>

</div>


<script>

  let transactions =
    JSON.parse(localStorage.getItem("moneyTracker")) || [];

  const form = document.getElementById("transactionForm");

  const description =
    document.getElementById("description");

  const amount =
    document.getElementById("amount");

  const type =
    document.getElementById("type");

  const category =
    document.getElementById("category");

  const date =
    document.getElementById("date");

  const transactionList =
    document.getElementById("transactionList");

  const filterType =
    document.getElementById("filterType");

  const search =
    document.getElementById("search");


  // Tanggal otomatis hari ini
  date.valueAsDate = new Date();


  // Format Rupiah
  function rupiah(number) {
    return new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(number);
  }


  // Simpan ke localStorage
  function saveData() {
    localStorage.setItem(
      "moneyTracker",
      JSON.stringify(transactions)
    );
  }


  // Tambah transaksi
  form.addEventListener("submit", function(e) {

    e.preventDefault();

    const transaction = {
      id: Date.now(),
      description: description.value,
      amount: Number(amount.value),
      type: type.value,
      category: category.value,
      date: date.value
    };

    transactions.push(transaction);

    saveData();

    form.reset();

    date.valueAsDate = new Date();

    render();

  });


  // Hapus transaksi
  function deleteTransaction(id) {

    transactions = transactions.filter(
      transaction => transaction.id !== id
    );

    saveData();

    render();

  }


  // Hapus semua
  function clearAll() {

    if (transactions.length === 0) {
      alert("Belum ada data.");
      return;
    }

    const confirmDelete =
      confirm("Yakin ingin menghapus semua transaksi?");

    if (confirmDelete) {

      transactions = [];

      saveData();

      render();

    }

  }


  // Render
  function render() {

    let income = 0;
    let expense = 0;

    transactions.forEach(transaction => {

      if (transaction.type === "income") {
        income += transaction.amount;
      } else {
        expense += transaction.amount;
      }

    });

    const balance = income - expense;

    document.getElementById("balance").textContent =
      rupiah(balance);

    document.getElementById("income").textContent =
      rupiah(income);

    document.getElementById("expense").textContent =
      rupiah(expense);


    // Filter
    const filter = filterType.value;
    const keyword = search.value.toLowerCase();

    let filtered =
      transactions.filter(transaction => {

        const matchType =
          filter === "all" ||
          transaction.type === filter;

        const matchSearch =
          transaction.description
            .toLowerCase()
            .includes(keyword) ||
          transaction.category
            .toLowerCase()
            .includes(keyword);

        return matchType && matchSearch;

      });


    // Urutkan terbaru
    filtered.sort((a, b) =>
      new Date(b.date) - new Date(a.date)
    );


    if (filtered.length === 0) {

      transactionList.innerHTML = `
        <div class="empty">
          Belum ada transaksi.
        </div>
      `;

      return;
    }


    transactionList.innerHTML =
      filtered.map(transaction => {

        const isIncome =
          transaction.type === "income";

        const sign =
          isIncome ? "+" : "-";

        const textClass =
          isIncome
            ? "income-text"
            : "expense-text";

        return `

          <div class="transaction">

            <div class="transaction-info">

              <strong>
                ${escapeHTML(transaction.description)}
              </strong>

              <small>
                ${escapeHTML(transaction.category)}
                • ${formatDate(transaction.date)}
              </small>

            </div>

            <div class="transaction-amount ${textClass}">
              ${sign}${rupiah(transaction.amount)}
            </div>

            <button
              class="delete-btn"
              onclick="deleteTransaction(${transaction.id})"
            >
              Hapus
            </button>

          </div>

        `;

      }).join("");

  }


  // Format tanggal
  function formatDate(dateString) {

    const date =
      new Date(dateString + "T00:00:00");

    return date.toLocaleDateString("id-ID", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });

  }


  // Mencegah HTML injection
  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  filterType.addEventListener(
    "change",
    render
  );

  search.addEventListener(
    "input",
    render
  );


  // Tampilan pertama
  render();

</script>

</body>
</html>
